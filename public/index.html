<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#20392e"><meta name="description" content="지인들과 함께하는 주사위 영토 전략 게임. 90개 영토에서 깃발을 올리고, 틈틈이 병력을 모아 진군하세요.">
  <title>삼국 · 함께 천하</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./map-style.css"><link rel="stylesheet" href="./expansion.css"><link rel="stylesheet" href="./heroes.css"><link rel="stylesheet" href="./seasons.css"><link rel="stylesheet" href="./readiness-layout.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%2320392e'/%3E%3Ctext x='32' y='44' text-anchor='middle' fill='%23e0c48c' font-size='38'%3E三%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./field-ui.css"></head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="삼국 함께 천하"><span class="brand-mark">三</span><span>삼국 <i>·</i> 함께 천하<small>각자의 깃발, 하나의 천하</small></span></a>
    <div class="world-title"><span class="status-dot" id="connection-dot"></span><span id="world-mode">깃발을 기다리는 전장</span></div>
    <nav aria-label="게임 메뉴"><button id="apply-update" hidden>업데이트 적용</button><button id="retry-sync" hidden>다시 연결</button><button id="chat-toggle" aria-controls="chat-panel" aria-expanded="false">전체 채팅 <span id="chat-unread"></span></button><button id="past-seasons" aria-label="삼국지 지난 역사">지난 역사</button><button id="heroes-button">무장 100인</button><button id="history-button">전황</button><button id="rules-button">규칙</button><button id="logout-button" hidden>나가기</button></nav>
  </header>
  <div id="season-banner" class="season-banner" role="status"></div><section id="season-history" class="season-history" hidden></section>
  <main class="game-layout">
    <section class="map-section">
      <div class="map-card" id="map-card">
        <div class="map-toolbar"><div class="map-tabs" role="tablist" aria-label="지도 디자인"><button data-map-theme="silk" role="tab" aria-selected="true">비단 지도</button><button data-map-theme="board" role="tab" aria-selected="false">군웅의 전술판</button></div><div class="map-actions"><button id="fit-own">내 영토 보기</button><select id="map-info" aria-label="지도 상태"><option value="basic">기본</option><option value="ready">영토 대기</option><option value="full">정원 도달</option></select><button data-zoom="out" aria-label="지도 축소">−</button><button data-zoom="all" aria-label="지도 전체 보기"><span data-map-zoom>100%</span></button><button data-zoom="in" aria-label="지도 확대">+</button></div></div>
        <div class="map-viewport"><svg role="group" aria-label="90개 영토 지도. 영토를 선택해 주둔 병력을 확인하세요."></svg></div>
        <details class="map-legend"><summary>군주별 색상</summary><div id="ruler-legend"></div></details><div class="map-caption"><span><i class="legend-own"></i>내 영토 <i class="legend-neutral"></i>중립</span><span id="map-hint">거점을 선택해 영토와 병력을 확인하세요.</span></div>
      </div>
    </section>
    <aside class="command-panel" id="command-panel">
      <div class="command-header"><div class="commander-title"><h2 id="commander-name">첫 출정을 준비하세요</h2><span id="save-status">기록 준비</span></div><div class="commander-subtitle"><span id="ruler-state">천하가 당신을 기다립니다</span><time id="world-clock">--:--</time></div><button id="name-change-button" class="text-button name-change-button" hidden>군주 이름 바꾸기</button><button id="panel-toggle" class="text-button" aria-expanded="true">정보 접기</button></div>
      <section id="return-news" class="return-news" hidden></section><div class="summary-strip" id="summary-strip" aria-label="내 세력 현황"></div>
      <div class="panel-tabs" role="tablist" aria-label="전장 정보"><button data-panel-tab="command" role="tab" aria-selected="true">영토·명령</button><button data-panel-tab="heroes" role="tab" aria-selected="false">내 장수</button><button data-panel-tab="ranking" role="tab" aria-selected="false">랭킹</button><button data-panel-tab="history" role="tab" aria-selected="false">전황</button></div>
      <div class="command-scroll" id="command-content"></div>
      <div class="command-footer" id="command-footer"></div>
    </aside>
    <section class="chat-panel" id="chat-panel" aria-label="전체 채팅">
      <div class="chat-heading"><h2>전체 채팅 <small id="chat-count">최근 5개</small></h2><button id="chat-open" class="text-button">대화 모두 보기 <span>↗</span></button></div>
      <div id="chat-filters" class="field-filters"></div><div id="chat-preview" class="chat-preview" aria-live="polite"></div>
      <form id="chat-form" class="chat-form"><label class="sr-only" for="chat-input">전체에 보낼 채팅</label><input id="chat-input" maxlength="200" placeholder="함께하는 군주들에게 한마디" autocomplete="off" disabled><button id="chat-send" type="submit" disabled>보내기</button></form>
    </section>
  </main>
  <nav class="mobile-shortcuts" aria-label="화면 바로가기"><button data-jump="map-card">지도</button><button data-jump="command-panel" id="jump-orders">명령 · 내 도시</button><button data-jump="chat-panel">채팅 <span id="mobile-unread"></span></button></nav><div id="announcement" class="announcement" role="status" aria-live="polite" hidden></div><dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" class="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
